name: 🚧 Main Preview Build (Rolling)

# Дев-сборки main (порт механизма krasava-app, только iOS). Каждый push в main
# (только код приложения) собирает версию {RELEASE_VERSION}-dev.N и заменяет
# файлы в ОДНОМ rolling-prerelease `preview`. GitHub Releases не плодятся,
# version.json НЕ обновляется — обычные пользователи этих сборок не видят.
# Dev-сборки видны через GBox-источник apps.json/apps-beta.json.

on:
  push:
    branches:
      - main
    paths:
      - 'MyMeds/**'
      - 'MyMedsWidget/**'
      - 'MyMedsCore/**'
      - 'DesignSystem/**'
      - 'project.yml'
      - 'tools/**'
      - '.github/workflows/preview-main.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-main
  cancel-in-progress: true

jobs:
  resolve:
    name: 🧭 Resolve Build Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build_id: ${{ steps.ver.outputs.build_id }}
      commit_sha: ${{ steps.ver.outputs.commit_sha }}
      prev_version: ${{ steps.ver.outputs.prev_version }}
    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4

      # ЕДИНСТВЕННОЕ место вычисления номера сборки: один запуск = одно число
      # для IPA, релиза и apps.json (github.run_started_at в выражениях
      # рендерится пустым — не полагаться на него).
      # Номер дев-сборки = прошлый номер той же линии +1 (имя релиза preview),
      # отменившиеся прогоны номер не съедают; смена releaseVersion → dev.1.
      - name: 🧭 Resolve version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 404 (релиза preview ещё нет, например в новом репо) gh отдаёт JSON
          # в stdout с кодом 1 — сбрасываем PREV, иначе JSON едет в --prev-version.
          PREV="$(gh api "repos/${{ github.repository }}/releases/tags/preview" --jq .name 2>/dev/null)" || PREV=""
          python tools/versioning.py resolve --channel dev --prev-version "${PREV:-}"

  build_ipa:
    name: 🍏 Build iOS Unsigned IPA (dev)
    runs-on: macos-26
    needs: resolve
    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔖 Patch version files (dev)
        run: python3 tools/versioning.py prepare --channel dev --prev-version "${{ needs.resolve.outputs.prev_version }}" --build-id "${{ needs.resolve.outputs.build_id }}"

      - name: 📦 Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 🛠️ Set Xcode Version
        run: |
          if [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          fi
          xcodebuild -version

      - name: 🏗️ Generate Xcode project
        run: xcodegen generate

      - name: 🧪 MyMedsCore unit tests
        run: |
          set -o pipefail
          swift test --package-path MyMedsCore 2>&1 | tee swift-test.log

      - name: 🔨 Build iOS App (no codesign)
        run: |
          set -o pipefail
          xcodebuild -scheme MyMeds \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee xcodebuild.log

      - name: 🚨 Surface build/test failures (annotations + summary)
        if: failure()
        run: |
          LOGS=$(ls swift-test.log xcodebuild.log 2>/dev/null)
          [ -z "$LOGS" ] && exit 0
          cat $LOGS | grep -E 'error:|XCTAssert.*failed|Fatal error' | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          {
            echo '### 🧪 Build/test failures'
            echo '```'
            cat $LOGS | grep -E 'error:|XCTAssert.*failed|Fatal error|Test Case.*failed' | sort -u | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📦 Package Unsigned IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r MyMeds-preview.ipa Payload
          rm -rf Payload

      - name: 📤 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyMeds-preview-IPA
          path: MyMeds-preview.ipa
          if-no-files-found: error

  publish_preview:
    name: 🚀 Publish Rolling Preview Release
    runs-on: ubuntu-latest
    needs: [resolve, build_ipa]
    if: always() && needs.build_ipa.result == 'success'
    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: MyMeds-preview-IPA
          path: download_ipa
        continue-on-error: true

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🚀 Publish rolling preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD: ${{ needs.resolve.outputs.build_id }}
          SHA: ${{ needs.resolve.outputs.commit_sha }}
        run: |
          IPA=$(find download_ipa -name '*.ipa' 2>/dev/null | head -n 1)
          ARGS=""
          [ -n "$IPA" ] && ARGS="--ipa $IPA"
          python tools/publish_release.py --channel preview --version "$VERSION" --build-number "$BUILD" --commit-sha "$SHA" $ARGS

  update_preview_feed:
    name: 📡 Update GBox Beta Source (rolling)
    runs-on: ubuntu-latest
    needs: [resolve, publish_preview]
    if: needs.publish_preview.result == 'success'
    steps:
      - name: 📚 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📝 Generate apps.json (rolling GBox source)
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD: ${{ needs.resolve.outputs.build_id }}
          SHA: ${{ needs.resolve.outputs.commit_sha }}
        run: python tools/update_version_feed.py --channel preview --version "$VERSION" --build-number "$BUILD" --commit-sha "$SHA" --out-dir dist_version

      - name: 📋 Copy remote config
        run: cp config.json dist_version/

      - name: 🚀 Deploy feeds to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist_version
          publish_branch: gh-pages
          keep_files: true
